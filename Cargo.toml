[workspace]
resolver = "2"
members = ["crates/sodam", "crates/sodam-core"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sodahub-org/sodam"
authors = ["sodahub-org"]

[workspace.dependencies]
# sodahub-org/gpui：fork 自 sonorahq/gpui（Zed gpui 新代码库），
# sonora 的丝滑滚动（Glide + Scroller + 自绘滚动条）就建立在它之上。
gpui = { git = "https://github.com/sodahub-org/gpui", rev = "5ff26c7", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/sodahub-org/gpui", rev = "5ff26c7", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sys-locale = "0.3"
dirs = "6"

# 本地开发默认跑的是 dev 构建；GPUI 的布局/绘制不优化时只有 ~30fps，
# 240Hz 屏上完全看不出高刷。应用代码用 opt-level=1（保留快速增量编译），
# 依赖（含 gpui）用 3。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
